name: Crawler policy check

# SEO/GEO spec CRAWLER-005: the deployed robots.txt must be a faithful build
# artifact of build/crawler-policy.json. This fails any change where the two
# have drifted (hand-edited robots.txt, or a policy edit without regenerating).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  robots-check:
    name: robots.txt matches crawler-policy.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build/robots.mjs --check
      # Honest-lastmod guard: the content-hash store MUST live in git. A fresh
      # checkout without it would re-stamp all 296 lastmod dates to the build
      # date - exactly the dishonest signal the store exists to prevent - and
      # verify.mjs cannot catch that because build:all regenerates the store
      # right before verify runs.
      - name: content-hash store is committed
        run: git ls-files --error-unmatch build/content-hashes.json
