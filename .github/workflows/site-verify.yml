name: Site verify

# SEO/GEO Phase 7.3, step 1.
#
# WHY THIS EXISTS: build/verify.mjs carries most of this repo's SEO assertions —
# entity-graph @id stability, facts.json-vs-page drift, hreflang reciprocity,
# honest sitemap lastmod — and until now it was run by NOTHING. It was reachable
# only via `npm run build:all` on a developer's machine, which means every
# assertion in it was advisory, and any new assertion added to it would have
# looked green in review precisely because it never executed. This job is what
# turns that file from a script into a gate.
#
# The `git diff` step is doing a second, separate job. GEO-CI-006 requires that
# sitemap lastmod equals a material content timestamp AND is unchanged on a
# non-content build. verify.mjs can check the first half but structurally cannot
# check the second, because build:all regenerates the content-hash store moments
# before verify runs. Rebuilding from a clean checkout and asserting the tree is
# unchanged is the only way to catch a build that re-stamps dates it should have
# kept — the exact dishonest-freshness signal the store exists to prevent.
#
# NOTE FOR ANYONE DEBUGGING A RED RUN ON THIS JOB: rebuilding on Windows produces
# a spurious diff. The `?v=<hash>` cache-busters are computed over on-disk bytes,
# so CRLF line endings yield different hashes on all ~316 pages while the page
# content is identical. This repo has no .gitattributes pinning eol=lf (the
# platform repo does). That is a local-only artefact — this job runs on Linux —
# but it is why "it's dirty on my machine" is not evidence of a real problem.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  site-verify:
    name: build:all passes verify and is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # Prerendering drives real Chromium; only that browser is needed.
      - name: Install Chromium for the prerenderer
        run: npx playwright install --with-deps chromium

      # og-card -> prerender -> sitemap -> verify. A verify.mjs failure fails here.
      - name: Build and verify
        run: npm run build:all

      - name: Generated output matches what is committed
        run: |
          if git diff --quiet; then
            echo "Rebuild produced no changes - generated output is in sync and reproducible."
            exit 0
          fi
          echo "::error::Rebuilding changed committed output. Either the generated files are stale (run 'npm run build:all' and commit the result), or the build is not reproducible and a lastmod date is being re-stamped without a content change."
          echo ""
          echo "--- changed files ---"
          git diff --stat
          echo ""
          echo "--- first 200 lines of diff ---"
          git diff | head -200
          exit 1
